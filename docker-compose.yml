services:
  postgres:
    image: postgres:16-alpine
    container_name: glorious_hr_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or a local .env file}
      POSTGRES_DB: ${POSTGRES_DB:-glorious_hr}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - glorious_pg_data:/var/lib/postgresql/data

volumes:
  glorious_pg_data: