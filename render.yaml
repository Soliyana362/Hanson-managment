# Render Blueprint for the Hanson HR portal.
# Import this repo in Render (New + > Blueprint) to create both services.
#
# Database: this blueprint intentionally does NOT create a Render Postgres.
# Render's free Postgres expires 30 days after creation, so use a permanent
# free database (e.g. Neon) and paste its connection string into DATABASE_URL.
#
# Secrets marked `sync: false` are left blank in the blueprint and prompted
# for in the Render dashboard on first deploy.

services:
  # ---------------------------------------------------------------- API ----
  - type: web
    name: glorious-hr-api
    runtime: node
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0 # required: default 127.0.0.1 is unreachable from Render's proxy
      - key: TRUST_PROXY
        value: "1" # required for correct client IPs / rate limiting behind Render's proxy
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        sync: false # paste your Neon connection string (includes ?sslmode=require)
      - key: JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: FRONTEND_URL
        sync: false # https://glorious-hr-web.onrender.com (set after the static site exists)
      - key: EMAIL_PROVIDER
        value: resend # resend | brevo | sendgrid
      - key: EMAIL_API_KEY
        sync: false # provider API key - enables HTTP email (needed on free tier)
      - key: EMAIL_FROM
        sync: false # e.g. "Hanson HR <no-reply@yourdomain.com>"
      - key: SEED_PASSWORD
        sync: false # used only by `npm run db:seed`
      # SMTP is only a fallback; ignored while EMAIL_API_KEY is set.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_TLS_REJECT_UNAUTHORIZED
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  # ------------------------------------------------------------ Frontend ----
  - type: web
    name: glorious-hr-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # https://glorious-hr-api.onrender.com (baked in at build time)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
